<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>Student Grade Calculator</h1>

        <label for="studentName">Student name</label>
        <input type="text" id="studentName" placeholder="Name">

        <label for="score1">Score 1</label>
        <input type="number" id="score1" placeholder="0 - 100">

        <label for="score2">Score 2</label>
        <input type="number" id="score2" placeholder="0 - 100">

        <label for="score3">Score 3</label>
        <input type="number" id="score3" placeholder="0 - 100">

        <button id="calcBtn">Calculate</button>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
